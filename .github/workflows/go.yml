name: Build

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: resources/package-lock.json

      - name: Install frontend dependencies
        working-directory: resources
        run: npm ci

      - name: Build frontend
        working-directory: resources
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: resources/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.id }}
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-amd64
            goos: linux
            goarch: amd64
            tags: ''
            output: gpm_linux_amd64
          - id: windows-amd64
            goos: windows
            goarch: amd64
            tags: ''
            output: gpm_windows_amd64.exe
          - id: darwin-amd64
            goos: darwin
            goarch: amd64
            tags: ''
            output: gpm_darwin_amd64
          - id: darwin-arm64
            goos: darwin
            goarch: arm64
            tags: ''
            output: gpm_darwin_arm64
          - id: linux-arm64
            goos: linux
            goarch: arm64
            tags: ''
            output: gpm_linux_arm64
          - id: linux-amd64-epoll
            goos: linux
            goarch: amd64
            tags: epoll
            output: gpm_linux_amd64_epoll
          - id: linux-arm64-epoll
            goos: linux
            goarch: arm64
            tags: epoll
            output: gpm_linux_arm64_epoll
          - id: linux-amd64-slim
            goos: linux
            goarch: amd64
            tags: slim
            output: gpm_linux_amd64_slim
          - id: windows-amd64-slim
            goos: windows
            goarch: amd64
            tags: slim
            output: gpm_windows_amd64_slim.exe
          - id: darwin-amd64-slim
            goos: darwin
            goarch: amd64
            tags: slim
            output: gpm_darwin_amd64_slim
          - id: darwin-arm64-slim
            goos: darwin
            goarch: arm64
            tags: slim
            output: gpm_darwin_arm64_slim
          - id: linux-arm64-slim
            goos: linux
            goarch: arm64
            tags: slim
            output: gpm_linux_arm64_slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: resources/dist

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true

      - name: Build and compress
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BUILD_TAGS: ${{ matrix.tags }}
          OUTPUT: ${{ matrix.output }}
        run: |
          version="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            version="dev-${GITHUB_SHA::12}"
          fi

          build_tags=()
          if [[ -n "$BUILD_TAGS" ]]; then
            build_tags=("-tags=$BUILD_TAGS")
          fi

          CGO_ENABLED=0 go build "${build_tags[@]}" \
            -ldflags="-s -w -X main.Version=$version" \
            -trimpath \
            -o "$OUTPUT" \
            ./cmd/go_process_manager
          gzip -9 "$OUTPUT"

      - name: Upload release artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.gz
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
